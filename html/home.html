<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daraz - Online Shopping Store</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/alignments.css">
  <link rel="stylesheet" href="../css/input.css">
  <link rel="stylesheet" href="../css/login.css">
  <!-- Google fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">

</head>

<body>

  <!-- Login Modal -->
  <div class="modal fade" id="loginModal" role="dialog" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body p-4">
          <!-- Close Button -->
          <button type="button" class="btn-close position-absolute" style="right: 15px; top: 15px;"
            data-bs-dismiss="modal" aria-label="Close"></button>

          <!-- Tabs -->
          <div class="d-flex justify-content-center mb-4">
            <ul class="nav nav-tabs border-0" id="loginTabs" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link" id="password-tab" data-bs-toggle="tab" data-bs-target="#passwordLogin"
                  type="button" role="tab">Password</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link active" id="phone-tab" data-bs-toggle="tab" data-bs-target="#phoneLogin"
                  type="button" role="tab">Phone Number</button>
              </li>
            </ul>
          </div>

          <div class="tab-content" id="loginTabContent">
            <!-- Password Tab -->
            <div class="tab-pane fade" id="passwordLogin" role="tabpanel">
              <form id="passwordForm">

                <div class="">
                  <div class="mb-3">
                    <input type="text" class="form-control" id="emailOrPhone"
                      placeholder="Please enter your email or phone">
                  </div>
                  <div class="mb-2">
                    <input type="password" class="form-control" id="password" placeholder="Please enter your password">
                  </div>
                  <div class="text-end mb-3">
                    <a href="#" class="text-decoration-none small text-muted">Forgot password?</a>
                  </div>

                </div>
                <button type="submit" class="btn btn-warning w-100 text-white">LOGIN</button>

                <div class="text-center mt-3">
                  <p class="small text-muted">Don't have an account? <a href="#"
                      class="text-primary text-decoration-none">Sign up</a></p>
                </div>

                <div class="text-center mt-4">
                  <p class="small text-muted mb-3">Or, login with</p>
                  <div class="d-flex justify-content-center gap-3">
                    <button type="button" class="btn btn-outline-secondary">
                      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg"
                        width="18" height="18" class="me-2">
                      Google
                    </button>
                    <button type="button" class="btn btn-outline-secondary">
                      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="#1877F2"
                        class="bi bi-facebook me-2" viewBox="0 0 16 16">
                        <path
                          d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951z" />
                      </svg>
                      Facebook
                    </button>
                  </div>
                </div>
              </form>
            </div>

            <!-- Phone Tab -->
            <div class="tab-pane fade show active" id="phoneLogin" role="tabpanel">
              <form id="phoneForm">
                <div class="d-flex gap-2 mb-3">
                  <div class="flex-shrink-0" style="width: 30%;">
                    <input type="text" class="form-control text-center" value="PK+92" readonly>
                  </div>
                  <div class="flex-grow-1">
                    <input type="tel" class="form-control" placeholder="Please enter your phone number">
                  </div>
                </div>

                <button type="submit"
                  class="btn btn-warning w-100 text-white d-flex align-items-center justify-content-center">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                    class="bi bi-whatsapp me-2" viewBox="0 0 16 16">
                    <path
                      d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z" />
                  </svg>
                  Send code via Whatsapp
                </button>

                <div class="text-center mt-3">
                  <p class="small text-muted">Don't have an account? <a href="#"
                      class="text-primary text-decoration-none">Sign up</a></p>
                </div>

                <div class="text-center mt-4">
                  <p class="small text-muted mb-3">Or, login with</p>
                  <div class="d-flex justify-content-center gap-3">
                    <button type="button" class="btn btn-outline-secondary">
                      <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg"
                        width="18" height="18" class="me-2">
                      Google
                    </button>
                    <button type="button" class="btn btn-outline-secondary">
                      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="#1877F2"
                        class="bi bi-facebook me-2" viewBox="0 0 16 16">
                        <path
                          d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0-.002 3.603-.002 8.05c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951z" />
                      </svg>
                      Facebook
                    </button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Header -->
  <header class="bg-orange">
    <div class="text-white py-1">
      <div class="container">
        <div class="m-lr-54">
          <div class="d-flex justify-content-end gap-4">
            <a href="#" class="text-white text-decoration-none fs-8 px-2" style="margin-right: -3px;">SAVE MORE ON
              APP</a>
            <a href="#" class="text-white text-decoration-none fs-8 px-2" style="margin-right: -3px;">SELL ON DARAZ</a>
            <a href="#" class="text-white text-decoration-none fs-8 px-2" style="margin-right: -3px;">HELP & SUPPORT</a>
            <a href="#" data-bs-toggle="modal" data-bs-target="#loginModal"
              class="text-white text-decoration-none fs-8 px-2" style="margin-right: -3px;">LOGIN</a>
            <a href="#" class="text-white text-decoration-none fs-8 px-2" style="margin-right: 5px;">SIGN UP</a>
            <a href="#" class="text-white text-decoration-none fs-8">زبان تبدیل کریں</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Navigation -->
    <div class="py-2">
      <div class="container pt-8 pb-26">
        <div class="m-lr-54">
          <div class="row align-items-center">
            <div class="col-md-2 col-3 d-flex align-items-center justify-content-start">
              <a href="#" class="text-decoration-none">
                <img src="../images/logo.png" alt="Daraz" class="img-fluid h-40">
              </a>
            </div>
            <div class="col-md-8 col-7" style="width: 44.5rem;">
              <div class="input-group" style="position: relative; top: -4px; left: 1px;">
                <input type="text" class="form-control " placeholder="Search in Daraz" aria-label="Search in Daraz"
                  style="height: 45px;">
                <button class="btn btn-light text-orange" type="button">
                  <img src="../images/search.svg" alt="Search" width="22px" class="top--2">
                </button>
              </div>
            </div>
            <div class="col-md-2 col-2 text-start">
              <a href="#" class="text-white fs-5">
                <i class="bi bi-cart"></i>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Bootstrap JS Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JavaScript -->
  <script src="../js/script.js"></script>
  <script src="../js/login.js"></script>

</body>

</html>
